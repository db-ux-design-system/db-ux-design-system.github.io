name: Deploy site (main) to GitHub Pages

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🖼️ Display node and pnpm version
        shell: bash
        run: |
          node --version
          pnpm --version

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm run lint

      - name: Build
        env:
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          pnpm run decode-db-theme-assets
          if [ "${{ github.event_name }}" != "pull_request" ]; then pnpm run cache:figma; fi
          pnpm run build

      - name: Playwright
        id: playwright
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          npx playwright install --with-deps chromium
          pnpm run test

      # Keep the actual/expected/diff screenshots of failing tests. The PR and
      # main runs build the site differently (e.g. `cache:figma` only runs on
      # main), so a snapshot regenerated on a PR can still fail on main. The
      # artifact is the only way to get at the image main actually renders.
      - name: 📤 Upload Playwright results
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.event_name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      # Skip for Dependabot: its runs have a read-only token and no access to
      # the GitHub App secrets, so the auto-commit cannot push. Renovate PRs
      # come from our own GitHub App and are allowed. Same gate as core-web's
      # snapshot-commit job.
      - name: Playwright regenerate snapshots
        if: |
          steps.playwright.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          (!contains(github.actor, '[bot]') || startsWith(github.head_ref, 'renovate-'))
        id: playwright-regenerate
        run: pnpm run test:regenerate

      - name: 🚘 Auto commit
        if: |
          steps.playwright-regenerate.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          (!contains(github.actor, '[bot]') || startsWith(github.head_ref, 'renovate-'))
        uses: ./.github/actions/auto-commit
        with:
          branch-name: '${{ github.head_ref }}-auto'
          commit-message: 'auto update snapshots'
          commit-files: 'tests/*-snapshots/*'
          auto-merge-client-id: ${{ vars.AUTO_MERGE_CLIENT_ID }}
          auto-merge-private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        if: ${{github.event_name != 'pull_request'}}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: ${{github.event_name != 'pull_request'}}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: ${{github.event_name != 'pull_request'}}
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
